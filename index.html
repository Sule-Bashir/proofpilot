<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ProofPilot - Receipt Processor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }
        .header p {
            opacity: 0.9;
            margin-top: 5px;
            font-size: 14px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #333;
        }
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .upload-area:hover {
            border-color: #667eea;
        }
        .upload-area.dragover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-area .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .upload-area p {
            color: #666;
            font-size: 14px;
        }
        .upload-area .supported {
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 12px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #e9ecef;
            color: #333;
            margin-top: 8px;
        }
        .result {
            padding: 16px;
            border-radius: 12px;
            margin-top: 12px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .result .label {
            font-weight: 600;
            font-size: 14px;
        }
        .result .value {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .expense-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .expense-item .left {
            flex: 1;
        }
        .expense-item .vendor {
            font-weight: 600;
            font-size: 16px;
        }
        .expense-item .amount {
            font-weight: 700;
            color: #28a745;
            font-size: 18px;
        }
        .expense-item .category {
            font-size: 12px;
            color: #666;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
        }
        .expense-item .status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .status-approved {
            background: #d4edda;
            color: #155724;
        }
        .status-review {
            background: #fff3cd;
            color: #856404;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .stat-item {
            text-align: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .stat-item .number {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        .stat-item .label {
            font-size: 12px;
            color: #666;
        }
        .filename {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            word-break: break-all;
        }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-auto {
            background: #d4edda;
            color: #155724;
        }
        .badge-review {
            background: #fff3cd;
            color: #856404;
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header h1 {
                font-size: 22px;
            }
        }
        .api-status {
            font-size: 12px;
            color: #999;
            text-align: center;
            padding: 8px;
            margin-top: 10px;
        }
        .api-status.online {
            color: #28a745;
        }
        .api-status.offline {
            color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📄 ProofPilot</h1>
        <p>Your expenses, handled. Your attention, protected.</p>
        <div class="api-status" id="apiStatus">⏳ Checking API connection...</div>
    </div>

    <!-- Upload Card -->
    <div class="card">
        <h3>📤 Upload Receipt</h3>
        <div class="upload-area" id="dropArea">
            <div class="icon">📁</div>
            <p>Tap or drag to upload</p>
            <p class="supported">Supports: TXT, JPG, PNG, PDF</p>
            <input type="file" id="fileInput" accept=".txt,.jpg,.jpeg,.png,.pdf">
        </div>
        <div class="filename" id="filenameDisplay"></div>
        <button class="btn" id="processBtn" disabled>Process Receipt</button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px; color: #666;">AI is analyzing your receipt...</p>
    </div>

    <!-- Result -->
    <div class="result" id="result"></div>

    <!-- Stats -->
    <div class="card">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-item">
                <div class="number" id="statTotal">0</div>
                <div class="label">Total</div>
            </div>
            <div class="stat-item">
                <div class="number" id="statApproved">0</div>
                <div class="label">Auto-Approved</div>
            </div>
            <div class="stat-item">
                <div class="number" id="statReview">0</div>
                <div class="label">Needs Review</div>
            </div>
        </div>
    </div>

    <!-- Expenses List -->
    <div class="card">
        <h3>📋 Recent Expenses</h3>
        <button class="btn btn-secondary" id="refreshBtn">🔄 Refresh</button>
        <div id="expensesList" style="margin-top: 12px;">
            <p style="color: #999; text-align: center;">No expenses yet. Upload a receipt!</p>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔧 API URL - Auto-detects local vs production
        // ============================================================
        // If running on localhost or 127.0.0.1, use local backend
        // Otherwise, use the Render backend
        const isLocal = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1';
        
        const API_URL = isLocal 
            ? 'http://127.0.0.1:8000' 
            : 'https://proofpilot-bpj6.onrender.com';
        // ============================================================

        const fileInput = document.getElementById('fileInput');
        const dropArea = document.getElementById('dropArea');
        const filenameDisplay = document.getElementById('filenameDisplay');
        const processBtn = document.getElementById('processBtn');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const refreshBtn = document.getElementById('refreshBtn');
        const apiStatus = document.getElementById('apiStatus');

        let selectedFile = null;

        // Check API connection
        async function checkAPI() {
            try {
                const response = await fetch(API_URL + '/health');
                if (response.ok) {
                    apiStatus.textContent = '✅ API Online';
                    apiStatus.className = 'api-status online';
                } else {
                    apiStatus.textContent = '⚠️ API Error';
                    apiStatus.className = 'api-status offline';
                }
            } catch (error) {
                apiStatus.textContent = '❌ API Offline - Make sure server is running';
                apiStatus.className = 'api-status offline';
                console.warn('API not reachable:', error);
            }
        }
        checkAPI();

        // File input change
        fileInput.addEventListener('change', function(e) {
            if (this.files.length > 0) {
                selectedFile = this.files[0];
                filenameDisplay.textContent = '📎 ' + selectedFile.name;
                processBtn.disabled = false;
            }
        });

        // Drag and drop
        dropArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });

        dropArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });

        dropArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                fileInput.files = e.dataTransfer.files;
                filenameDisplay.textContent = '📎 ' + selectedFile.name;
                processBtn.disabled = false;
            }
        });

        dropArea.addEventListener('click', function() {
            fileInput.click();
        });

        // Process receipt
        processBtn.addEventListener('click', async function() {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            processBtn.disabled = true;
            loadingDiv.classList.add('show');
            resultDiv.classList.remove('show');

            try {
                const response = await fetch(API_URL + '/process-receipt', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Processing failed');
                }

                // Show result
                const statusClass = data.status === 'auto_approved' ? 'success' : 'warning';
                const statusBadge = data.status === 'auto_approved'
                    ? '<span class="badge badge-auto">✅ Auto-Approved</span>'
                    : '<span class="badge badge-review">⚠️ Needs Review</span>';

                resultDiv.className = 'result show ' + statusClass;
                resultDiv.innerHTML = `
                    <div class="value"><strong>${data.vendor}</strong></div>
                    <div class="value" style="font-size: 24px; font-weight: 700;">${data.currency} ${data.amount.toLocaleString()}</div>
                    <div class="value">Category: ${data.category}</div>
                    <div class="value">Confidence: ${(data.confidence * 100).toFixed(0)}% ${statusBadge}</div>
                    <div class="value" style="font-size: 13px; color: #666;">${data.message}</div>
                `;

                // Refresh stats and list
                loadStats();
                loadExpenses();

            } catch (error) {
                resultDiv.className = 'result show error';
                resultDiv.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
            } finally {
                loadingDiv.classList.remove('show');
                processBtn.disabled = false;
                selectedFile = null;
                fileInput.value = '';
                filenameDisplay.textContent = '';
            }
        });

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(API_URL + '/stats');
                const data = await response.json();
                document.getElementById('statTotal').textContent = data.total_expenses || 0;
                document.getElementById('statApproved').textContent = data.auto_approved || 0;
                document.getElementById('statReview').textContent = data.needs_review || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load expenses
        async function loadExpenses() {
            try {
                const response = await fetch(API_URL + '/expenses');
                const data = await response.json();
                const list = document.getElementById('expensesList');

                if (!data.expenses || data.expenses.length === 0) {
                    list.innerHTML = '<p style="color: #999; text-align: center;">No expenses yet. Upload a receipt!</p>';
                    return;
                }

                list.innerHTML = data.expenses.slice(0, 10).map(e => {
                    const statusClass = e.status === 'auto_approved' ? 'status-approved' : 'status-review';
                    const statusLabel = e.status === 'auto_approved' ? '✅ Approved' : '⚠️ Review';
                    return `
                        <div class="expense-item">
                            <div class="left">
                                <div class="vendor">${e.vendor}</div>
                                <div>
                                    <span class="category">${e.category}</span>
                                    <span class="status ${statusClass}">${statusLabel}</span>
                                </div>
                                <div style="font-size: 11px; color: #999; margin-top: 4px;">
                                    ${e.filename || 'Unknown file'} • ${new Date(e.created_at).toLocaleDateString()}
                                </div>
                            </div>
                            <div class="amount">${e.currency} ${e.amount.toLocaleString()}</div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading expenses:', error);
            }
        }

        // Refresh button
        refreshBtn.addEventListener('click', function() {
            loadStats();
            loadExpenses();
            checkAPI();
            this.textContent = '✅ Refreshed!';
            setTimeout(() => { this.textContent = '🔄 Refresh'; }, 2000);
        });

        // Load on start
        loadStats();
        loadExpenses();
    </script>

</body>
</html>
<!-- Trigger deployment -->
